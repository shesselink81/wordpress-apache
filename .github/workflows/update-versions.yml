name: Update Helm Chart Versions (WordPress)

on:
  schedule:
    # Every Monday at 07:00 UTC (1h after the nginx workflow)
    - cron: '0 7 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  packages: read

jobs:
  update-versions:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout wordpress-apache
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout dockerfiles tools
        uses: actions/checkout@v4
        with:
          repository: shesselink81/static-sites
          path: .dockerfiles-tools
          sparse-checkout: |
            update-versions.ps1

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Run version update script (WordPress mode)
        shell: pwsh
        run: |
          ./.dockerfiles-tools/update-versions.ps1 `
            -Mode WordPress `
            -WordpressRepo "${{ github.workspace }}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Remove tooling checkout
        run: rm -rf .dockerfiles-tools

      - name: Check for changes
        id: changes
        run: |
          if [ -n "$(git status --porcelain -- wordpress-alpine)" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Get new chart version
        id: version
        run: |
          TAG=$(grep '^appVersion:' wordpress-alpine/chart/source/Chart.yaml | sed 's/appVersion: *//;s/"//g;s/ *#.*//')
          echo "tag=v$TAG" >> "$GITHUB_OUTPUT"

      - name: Commit and push to main
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add wordpress-alpine
          git commit -m "chore: auto-update WordPress Helm chart to ${{ steps.version.outputs.tag }}"
          git push origin main

      - name: Create GitHub Release
        if: steps.changes.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          NOTES=$(printf 'Auto-updated wordpress-alpine Helm chart.\n\nNew WordPress version: %s' "$TAG")
          gh release create "$TAG" \
            --title "wordpress-alpine $TAG" \
            --notes "$NOTES" \
            --latest
