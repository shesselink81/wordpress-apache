name: Release on Tag

on:
  push:
    tags:
      - '7.*'   # Trigger op tags zoals v1.0.0, v2.3.1 etc.

env:
  # Use docker.io for Docker Hub if empty
  REGISTRY: ghcr.io
  # github.repository as <account>/<repo>
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    name: Build Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      -
        name: Docker meta
        id: meta
        uses: docker/metadata-action@v4
        with:
          images: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
      -
        # Add support for more platforms with QEMU (optional)
        # https://github.com/docker/setup-qemu-action
        name: Set up QEMU
        uses: docker/setup-qemu-action@v2
        
      # Workaround: https://github.com/docker/build-push-action/issues/461
      - name: Setup Docker buildx
        uses: docker/setup-buildx-action@v2

      # Login against a Docker registry except on PR
      # https://github.com/docker/login-action
      - name: Log into registry ${{ env.REGISTRY }}
        if: github.event_name != 'pull_request'
        uses: docker/login-action@28218f9b04b4f3f62068d7b6ce6ca5b26e35336c
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      -
        name: Build
        uses: docker/bake-action@v2
        with:
          push: true
          set: |
            build.args.WP_DOMAINNAME=wp.internal
          files: |
            ./docker-bake.hcl
            ${{ steps.meta.outputs.bake-file }}
          targets: build

      - name: Create artifact (example)
        run: |
          mkdir output
          echo "build completed for $GITHUB_REF_NAME" > output/info.txt

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: build-output
          path: output/
          
  release:
      name: Create GitHub Release
      needs: build
      runs-on: ubuntu-latest

      steps:
        - name: Download build artifacts
          uses: actions/download-artifact@v4
          with:
            name: build-output
            path: release/

        - name: Create GitHub Release
          uses: softprops/action-gh-release@v2
          with:
            tag_name: ${{ github.ref_name }}
            name: Release ${{ github.ref_name }}
            body: |
              🚀 **Automatische release gebouwd met GitHub Actions**
              - Commit: ${{ github.sha }}
              - Tag: ${{ github.ref_name }}
            files: |
              release/**
