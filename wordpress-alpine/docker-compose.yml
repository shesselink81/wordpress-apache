version: "3.9"

services:
   wordpress-init:
    image: wordpress:cli-php8.4
    depends_on:
      db:
        condition: service_healthy
    restart: "no"
    user: root
    command: ["/bin/bash", "/tmp/init.sh"]
    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_USER: wp_user
      WORDPRESS_DB_PASSWORD: wp_pass
      WORDPRESS_DB_NAME: wp_db
      WP_ADMIN_USER: ${WP_USERNAME}
      WP_ADMIN_PASSWORD: ${WP_PASSWORD}
      WP_TITLE: "New wordpress blog"
      WP_ADMIN_EMAIL: admin@example.com
      WP_LOCALE: ${WP_LOCALE}
      WP_INIT: "true"
      WP_URL: "https://${WP_DOMAINNAME}"
      WORDPRESS_VERSION: ${WORDPRESS_VERSION}

    volumes:
      - wordpress:/var/www/html:rw
      - ./init-alpine.sh:/tmp/init.sh:ro
      - ./cache-config.json:/tmp/cache-config.json:ro

   memcached:
    image: memcached:latest
    restart: always

   wordpress:
    #image: wordpress-alpine:v1.0.0
    build: .
    #container_name: wp-fpm
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      wordpress-init:
        condition: service_completed_successfully
      memcached:
        condition: service_started
    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_USER: wp_user
      WORDPRESS_DB_PASSWORD: wp_pass
      WORDPRESS_DB_NAME: wp_db
      WORDPRESS_CONFIG_EXTRA: |
        define('FORCE_SSL_ADMIN', true);

        if (array_key_exists('HTTP_X_FORWARDED_PROTO', $_SERVER)) {
            if ($_SERVER['HTTP_X_FORWARDED_PROTO'] === 'https') {
                $_SERVER['HTTPS'] = 'on';
            }
        }

        if (array_key_exists('HTTPS', $_SERVER)) {
            if ($_SERVER['HTTPS'] === 'on') {
                $_SERVER['HTTPS'] = 'on';
            }
        }

        define('FS_METHOD', 'direct');
        define('WP_CACHE', true);
        define('WP_HOME', 'https://${WP_DOMAINNAME}');
        define('WP_SITEURL', 'https://${WP_DOMAINNAME}');

    volumes:
      - wordpress:/var/www/html:rw
      - ./php-fpm.conf:/usr/local/etc/php-fpm.d/zz-custom.conf:ro
      - ./php.ini:/usr/local/etc/php/conf.d/zz-custom.ini:ro

   db:
    image: mariadb
    #container_name: wp-db
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "mariadb-admin ping -h localhost -u root -p$MYSQL_ROOT_PASSWORD"]
      interval: 10s
      timeout: 5s
      retries: 5
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: wp_db
      MYSQL_USER: wp_user
      MYSQL_PASSWORD: wp_pass
    volumes:
      - db_data:/var/lib/mysql

   nginx:
    #image: nginx:alpine
    build:
      context: ./nginx/
      args:
        - WP_DOMAINNAME=${WP_DOMAINNAME}
    #container_name: wp-nginx
    restart: unless-stopped
    depends_on:
      - wordpress
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - wordpress:/var/www/html:rw
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:rw
      #- ./nginx/ssl:/etc/nginx/ssl:ro

volumes:
  wordpress:
  db_data:
