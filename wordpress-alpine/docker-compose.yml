version: "3.9"

services:
   wordpress-init:
    image: wordpress:cli-php8.5
    depends_on:
      db:
        condition: service_healthy
    restart: "no"
    #user: root
    command: ["/bin/bash", "/tmp/init.sh"]
    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_USER: ${MYSQL_USER}
      WORDPRESS_DB_PASSWORD: ${MYSQL_PASSWORD}
      WORDPRESS_DB_NAME: ${MYSQL_DATABASE}
      WP_ADMIN_USER: ${WP_USERNAME}
      WP_ADMIN_PASSWORD: ${WP_PASSWORD}
      WP_TITLE: "New wordpress blog"
      WP_ADMIN_EMAIL: admin@example.com
      WP_LOCALE: ${WP_LOCALE}
      WP_INIT: "true"
      WP_URL: "${WP_SCHEME}://${WP_DOMAINNAME}"
      WORDPRESS_VERSION: ${WORDPRESS_VERSION}
      MEMCACHED_HOST: ${MEMCACHED_HOST}
      WP_CORE_AUTO_UPDATE: ${WP_CORE_AUTO_UPDATE}

    volumes:
      - wordpress:/var/www/html:rw
      - ./init-alpine.sh:/tmp/init.sh:ro
      - ./cache-config.json:/tmp/cache-config.json:ro
      - D:\Users\Sander\nextcloud\Backup\playlists\updraft:/tmp/updraft/:rw

   memcached:
    image: memcached:latest
    restart: always

   wordpress:
    image: ghcr.io/shesselink81/wordpress-alpine:7.0.3.1
    build:
      context: .
      dockerfile: Dockerfile
      no_cache: false
      args:
        WORDPRESS_VERSION: 7.0.3
        WP_LOCALE: en_US
    container_name: wp-fpm
    restart: unless-stopped
    user: 82:82
    extra_hosts:
      - "wordpress.local:host-gateway"
    depends_on:
      db:
        condition: service_healthy
      wordpress-init:
        condition: service_completed_successfully
      memcached:
        condition: service_started
    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_USER: ${MYSQL_USER}
      WORDPRESS_DB_PASSWORD: ${MYSQL_PASSWORD}
      WORDPRESS_DB_NAME: ${MYSQL_DATABASE}
      MEMCACHED_HOST: ${MEMCACHED_HOST}

    volumes:
      - wordpress:/var/www/html:rw
      - ./php-fpm.conf:/usr/local/etc/php-fpm.d/zz-custom.conf:ro
      - ./php.ini:/usr/local/etc/php/conf.d/zz-custom.ini:ro
      #- ./cache-config.json:/tmp/cache-config.json:ro

   db:
    image: mariadb:12.3.2
    container_name: wp-db
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "mariadb-admin ping -h localhost -u root -p$MYSQL_ROOT_PASSWORD"]
      interval: 10s
      timeout: 5s
      retries: 5
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - db_data:/var/lib/mysql

   nginx:
    image: ghcr.io/shesselink81/nginx-alpine:7.0.3.1
    build:
      context: ./nginx/
    container_name: wp-nginx
    restart: unless-stopped
    user: 101:101
    depends_on:
      - wordpress
    ports:
      - "8080:8080"
      - "9443:9443"
    environment:
      - NGINX_HOST=wordpress.local
      - NGINX_PORT=8080
      - NGINX_SSL_PORT=9443
    volumes:
      - wordpress:/var/www/html:rw
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:rw
  
volumes:
  wordpress:
  db_data:
