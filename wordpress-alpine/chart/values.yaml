image:
  fpm: ghcr.io/shesselink81/wordpress-alpine:v6.9.0.6
  nginx: ghcr.io/shesselink81/nginx-alpine:v6.9.0.5
  init: wordpress:cli-php8.4
  db: mariadb:12.1.2

env:
  mysql:
    user: wordpress
    password: wordpress
    database: wordpress
    fullnameOverride: {}
  wp:
    scheme: https
    domainname: wordpress.local
    url: "${scheme}://${domainname}"
    version: "6.9.0"
    locale: nl_NL
    title: "Mijn WordPress Site"
    admin_user: admin
    admin_password: admin
    debug: "false"
    mu_plugins_configmaps: []

wordpress:
  muPluginsConfigMaps: []
  init:
    enabled: true
    customInitConfigMap:
      name: ""
      key: "commands.sh"

persistence:
  wordpress:
    enabled: true
    size: 5Gi
  db:
    enabled: true
    size: 5Gi

service:
  nginx:
    port: 80
  db:
    port: 3306

ingress:
  enabled: true
  className: "traefik"
  annotations: {}
  hosts:
    - host: wordpress.local
      paths:
        - path: /
          pathType: ImplementationSpecific
  tls: []
  useHttpsBackend: false
  extraRules: []

memcached:
  enabled: true
  createConfig: true
  nameOverride: ""
  fullnameOverride: ""
  commonLabels: {}
  commonAnnotations: {}
  image:
    registry: ""
    repository: docker.io/memcached
    tag: "1.6.39@sha256:4737e17016e4d65ad8007408ec1816096c4ebec04cfa89a5265a3edd3f4ca552"
    pullPolicy: IfNotPresent
  replicaCount: 1
  service:
    type: ClusterIP
    port: 11211
  containerSecurityContext:
    runAsUser: 11211
    runAsNonRoot: true
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL
    seccompProfile:
      type: RuntimeDefault