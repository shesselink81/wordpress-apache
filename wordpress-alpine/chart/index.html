<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Helm Chart Repository</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #0f172a;
      color: #e5e7eb;
      margin: 0;
      padding: 2rem;
    }
    .container {
      max-width: 720px;
      margin: 0 auto;
    }
    h1 {
      color: #38bdf8;
    }
    code, pre {
      background: #020617;
      padding: 0.75rem;
      border-radius: 6px;
      display: block;
      overflow-x: auto;
      color: #e5e7eb;
    }
    a {
      color: #38bdf8;
      text-decoration: none;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Helm Chart Repository</h1>

    <p>
      This is a Helm chart repository.
    </p>

    <h2>Usage</h2>

    <pre><code>helm repo add myrepo https://shesselink81.github.io/wordpress-apache/wordpress-alpine/chart
helm repo update
helm install wp myrepo/wordpress-alpine</code></pre>

    <h2>Browse Charts</h2>

    <p>
      See <a href="index.yaml">index.yaml</a> for available charts.
    </p>

    <hr>

    <p>
      Generated by <code>helm repo index</code>
    </p>
  </div>
</body>
</html>
