apiVersion: v1
kind: Service
metadata:
  name: {{ include "wordpress-alpine.fullname" . }}-nginx
spec:
  selector:
    {{- include "wordpress-alpine.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: nginx
  ports:
    - port: {{ .Values.nginx.service.port }}
      targetPort: 8080
      protocol: TCP