apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "wordpress-alpine.fullname" . }}-nginx
spec:
  selector:
    matchLabels:
      app: nginx
  template:
    metadata:
      labels:
        app: nginx
    spec:
      initContainers:
        - name: fix-permissions
          image: busybox
          command:
            - sh
            - -c
            - chown -R 82:82 /var/www/html
          securityContext:
            runAsUser: 0
          volumeMounts:
            - name: wordpress
              mountPath: /var/www/html

      containers:
        - name: nginx
          image: {{ .Values.image.nginx }}
          securityContext:
            runAsUser: 82
          ports:
            - containerPort: {{ .Values.nginx.service.port }}
          {{- with .Values.nginx.resources }}    
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - mountPath: /var/www/html
              name: wordpress
            - mountPath: /etc/nginx/conf.d/default.conf
              name: nginxconf
              subPath: default.conf
      volumes:
        - name: wordpress
          persistentVolumeClaim:
            claimName: {{ include "wordpress-alpine.pvcName" . }}
            readOnly: false
        - name: nginxconf
          configMap:
            name: {{ include "wordpress-alpine.fullname" . }}-nginx-config