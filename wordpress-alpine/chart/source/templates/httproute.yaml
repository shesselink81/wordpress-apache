{{- if .Values.httproute.enabled }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "wordpress-alpine.fullname" . }}
  labels:
    {{- include "wordpress-alpine.labels" . | nindent 4 }}
spec:
  parentRefs:
    - name: {{ .Values.httproute.gateway.name }}
      namespace: {{ .Values.httproute.gateway.namespace | default .Release.Namespace }}
  hostnames:
    {{- range .Values.httproute.hostnames }}
    - {{ . | quote }}
    {{- end }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: {{ .Values.httproute.path | default "/" }}
      backendRefs:
        - name: {{ include "wordpress-alpine.fullname" . }}-nginx
          port: {{ .Values.nginx.service.port }}
{{- end }}
