services:
  db:
    image: mariadb
    restart: always
    environment:
      MARIADB_USER: wp_user
      MARIADB_DATABASE: wp_db
      MARIADB_PASSWORD: wp_pass
      MARIADB_ROOT_PASSWORD: rootpass
    volumes:
      - db:/var/lib/mysql

  memcached:
    image: memcached:1.6.39
    restart: always

  wordpress-cli:
    image: wordpress:cli-php8.4
    depends_on:
      db:
        condition: service_started
    restart: "always"
    user: www-data
    command: ["/bin/bash", "-c", "sleep infinity"]
    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_USER: wp_user
      WORDPRESS_DB_PASSWORD: wp_pass
      WORDPRESS_DB_NAME: wp_db
      WP_URL: "https://${WP_DOMAINNAME}"
      WORDPRESS_VERSION: ${WORDPRESS_VERSION}
    volumes:
      - wordpress:/var/www/html:rw
      #- ./init.sh:/tmp/init.sh:ro
      #- ./wordpress-alpine/cache-config.json:/tmp/cache-config.json:ro
  wordpress-init:
    image: wordpress:cli-php8.4
    depends_on:
      db:
        condition: service_started
    restart: "no"
    user: root
    command: ["/bin/bash", "/tmp/init.sh"]
    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_USER: wp_user
      WORDPRESS_DB_PASSWORD: wp_pass
      WORDPRESS_DB_NAME: wp_db
      WP_ADMIN_USER: ${WP_USERNAME}
      WP_ADMIN_PASSWORD: ${WP_PASSWORD}
      WP_TITLE: "New wordpress blog"
      WP_ADMIN_EMAIL: admin@example.com
      WP_LOCALE: ${WP_LOCALE}
      WP_INIT: "true"
      WP_URL: "https://${WP_DOMAINNAME}"
      WORDPRESS_VERSION: ${WORDPRESS_VERSION}
    volumes:
      - wordpress:/var/www/html:rw
      - ./init.sh:/tmp/init.sh:ro
      - ./wordpress-alpine/cache-config.json:/tmp/cache-config.json:ro

  wordpress:
    #image: ghcr.io/shesselink81/wordpress-apache:v6.8.3.11
    build:
      context: .
      args:
        - WP_DOMAINNAME=${WP_DOMAINNAME}
    restart: always
    user: www-data
    depends_on:
      db:
        condition: service_started
      wordpress-init:
        condition: service_completed_successfully
      memcached:
        condition: service_started
    ports:
      - "80:80"
      - "443:443"
    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_USER: wp_user
      WORDPRESS_DB_PASSWORD: wp_pass
      WORDPRESS_DB_NAME: wp_db
      WP_DOMAINNAME: ${WP_DOMAINNAME}
    volumes:
      - wordpress:/var/www/html:rw

volumes:
  wordpress:
  db:
